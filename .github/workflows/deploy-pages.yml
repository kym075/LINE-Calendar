name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static files
        env:
          GAS_API_URL: ${{ secrets.GAS_API_URL }}
          LIFF_ID: ${{ secrets.LIFF_ID }}
        run: |
          test -n "$GAS_API_URL"
          test -n "$LIFF_ID"
          mkdir _site
          cp index.html style.css script.js _site/
          cp -R vendor _site/vendor
          printf 'window.APP_CONFIG = {\n  API_URL: "%s",\n  LIFF_ID: "%s",\n};\n' "$GAS_API_URL" "$LIFF_ID" > _site/config.js
          sed -i "s|href=\"style.css\"|href=\"style.css?v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"|" _site/index.html
          sed -i "s|src=\"config.js\"|src=\"config.js?v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"|" _site/index.html
          sed -i "s|src=\"script.js\"|src=\"script.js?v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\"|" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
